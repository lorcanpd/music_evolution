# Nginx configuration for music_evo
# Includes rate limiting, security headers, and reverse proxy settings

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript;

    # ==========================================================================
    # Rate Limiting Zones
    # ==========================================================================

    # General rate limit: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Strict rate limit for form submissions: 2 requests/second per IP
    limit_req_zone $binary_remote_addr zone=forms:10m rate=2r/s;

    # Audio file rate limit: 5 requests/second per IP
    limit_req_zone $binary_remote_addr zone=audio:10m rate=5r/s;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ==========================================================================
    # Security Settings
    # ==========================================================================

    # Hide nginx version
    server_tokens off;

    # Request body size limit (prevent large uploads)
    client_max_body_size 1M;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Buffer sizes
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
